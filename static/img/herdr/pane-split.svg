<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Splitting a Herdr pane, starting an agent, and watching its state</title>
  <desc id="desc">An animated walkthrough: a shell runs npm run dev in one pane. A second pane slides in after prefix+v, an agent starts in it, and the sidebar chip changes from idle to working and then done.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .mono { font-size: 12.5px; fill: #cbd5e1; }
      .small { font-size: 12.5px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .pane-b { animation: paneB 10s ease-in-out infinite; }
      .divider { animation: divider 10s ease-in-out infinite; }
      .chip-idle { animation: chipIdle 10s ease-in-out infinite; }
      .chip-working { animation: chipWorking 10s ease-in-out infinite; }
      .chip-done { animation: chipDone 10s ease-in-out infinite; }
      .typing { animation: typing 10s steps(7) infinite; }
      .prompt-line { animation: promptLine 10s ease-in-out infinite; }
      .done-line { animation: doneLine 10s ease-in-out infinite; }
      .blink { animation: blink 1s steps(1) infinite; }
      .phase1 { animation: phase1 10s ease-in-out infinite; }
      .phase2 { animation: phase2 10s ease-in-out infinite; }
      .phase3 { animation: phase3 10s ease-in-out infinite; }
      @keyframes paneB {
        0%, 20% { transform: translateX(330px); opacity: 0; }
        32%, 100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes divider {
        0%, 22% { opacity: 0; }
        30%, 100% { opacity: 1; }
      }
      @keyframes chipIdle {
        0%, 34% { opacity: 1; }
        40%, 100% { opacity: 0; }
      }
      @keyframes chipWorking {
        0%, 34% { opacity: 0; }
        40%, 64% { opacity: 1; }
        70%, 100% { opacity: 0; }
      }
      @keyframes chipDone {
        0%, 64% { opacity: 0; }
        72%, 100% { opacity: 1; }
      }
      @keyframes typing {
        0%, 34% { clip-path: inset(0 100% 0 0); }
        50%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes promptLine {
        0%, 48% { opacity: 0; }
        56%, 100% { opacity: 1; }
      }
      @keyframes doneLine {
        0%, 72% { opacity: 0; }
        80%, 100% { opacity: 1; }
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes phase1 { 0%, 18% { opacity: 1; } 26%, 100% { opacity: .28; } }
      @keyframes phase2 { 0%, 24% { opacity: .28; } 34%, 66% { opacity: 1; } 76%, 100% { opacity: .28; } }
      @keyframes phase3 { 0%, 70% { opacity: .28; } 80%, 100% { opacity: 1; } }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">Split → start an agent → watch the state</text>
  <text x="32" y="62" class="sub">One keystroke gives the agent its own terminal; its lifecycle appears in the sidebar automatically.</text>

  <!-- Window -->
  <rect x="40" y="76" width="880" height="310" rx="12" fill="#0f1626" stroke="#22304a"/>
  <rect x="40" y="76" width="880" height="30" rx="12" fill="#16213a"/>
  <rect x="40" y="94" width="880" height="12" fill="#16213a"/>
  <circle cx="60" cy="91" r="4" fill="#f87171"/>
  <circle cx="74" cy="91" r="4" fill="#fbbf24"/>
  <circle cx="88" cy="91" r="4" fill="#34d399"/>
  <text x="108" y="95" class="tiny">portfolio-site — herdr</text>

  <!-- Sidebar -->
  <rect x="40" y="106" width="190" height="280" fill="#0d1424"/>
  <line x1="230" y1="106" x2="230" y2="386" stroke="#22304a"/>
  <text x="56" y="128" class="tiny">AGENTS</text>

  <rect x="50" y="138" width="170" height="34" rx="6" fill="#12203a"/>
  <text x="62" y="160" class="mono">claude</text>
  <g class="chip-idle">
    <rect x="132" y="147" width="46" height="17" rx="8.5" fill="#1a2333" stroke="#334155"/>
    <text x="155" y="159" class="tiny" text-anchor="middle" fill="#94a3b8">idle</text>
  </g>
  <g class="chip-working">
    <rect x="132" y="147" width="58" height="17" rx="8.5" fill="#3b2a12" stroke="#a16207"/>
    <text x="161" y="159" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  </g>
  <g class="chip-done">
    <rect x="132" y="147" width="48" height="17" rx="8.5" fill="#0d2a20" stroke="#15803d"/>
    <text x="156" y="159" class="tiny" text-anchor="middle" fill="#34d399">done</text>
  </g>

  <text x="62" y="200" class="mono">shell</text>
  <rect x="132" y="187" width="44" height="17" rx="8.5" fill="#0f2438" stroke="#1d4ed8"/>
  <text x="154" y="199" class="tiny" text-anchor="middle" fill="#60a5fa">shell</text>

  <text x="62" y="238" class="mono">codex</text>
  <rect x="132" y="225" width="44" height="17" rx="8.5" fill="#1a2333" stroke="#334155"/>
  <text x="154" y="237" class="tiny" text-anchor="middle" fill="#94a3b8">idle</text>

  <text x="56" y="286" class="tiny">WORKSPACES</text>
  <text x="56" y="308" class="small">portfolio-site</text>
  <text x="56" y="330" class="tiny">api-service</text>
  <text x="56" y="352" class="tiny">docs</text>

  <!-- Pane A -->
  <rect x="242" y="118" width="666" height="256" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="258" y="144" class="mono">$ npm run dev</text>
  <text x="258" y="166" class="tiny" fill="#34d399">VITE v7 ready in 312 ms</text>
  <text x="258" y="186" class="tiny">Local: http://localhost:3000/</text>
  <text x="258" y="206" class="tiny">press h + enter to show help</text>
  <rect x="258" y="222" width="8" height="12" class="blink" fill="#34d399"/>

  <!-- Pane B overlay -->
  <g class="pane-b">
    <rect x="566" y="118" width="342" height="256" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <line x1="566" y1="118" x2="566" y2="374" stroke="#22304a" class="divider" stroke-width="2"/>
    <text x="582" y="144" class="mono typing">$ claude</text>
    <text x="582" y="168" class="tiny prompt-line" fill="#93c5fd">❯ add a /search page that filters posts</text>
    <text x="582" y="190" class="tiny prompt-line">● reading src/pages, src/blog…</text>
    <text x="582" y="212" class="tiny prompt-line">● editing 3 files</text>
    <text x="582" y="240" class="tiny done-line" fill="#34d399">✔ done — 3 files changed, build passes</text>
    <text x="582" y="262" class="tiny done-line">review the diff before you merge</text>
    <rect x="582" y="286" width="8" height="12" class="blink" fill="#34d399"/>
  </g>

  <!-- Phase captions -->
  <text x="330" y="410" class="tiny phase1" text-anchor="middle" fill="#94a3b8">prefix+v · split right</text>
  <text x="520" y="410" class="tiny phase2" text-anchor="middle" fill="#94a3b8">agent detected · state tracked</text>
  <text x="748" y="410" class="tiny phase3" text-anchor="middle" fill="#34d399">done · notification + badge</text>
</svg>
