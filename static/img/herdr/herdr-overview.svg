<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Herdr architecture: one background server, many terminal clients</title>
  <desc id="desc">An animated diagram showing a terminal client attaching to a Herdr background server that hosts two workspaces, each with panes running coding agents. A second SSH machine runs its own Herdr server. Agent state chips pulse as they work, are blocked, or finish.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .small { font-size: 12.5px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .mono { font-size: 12.5px; fill: #cbd5e1; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
      .flow-slow { stroke-dasharray: 4 5; animation: dash 1.8s linear infinite; }
      .pulse { animation: pulse 1.7s ease-in-out infinite; }
      .pulse-slow { animation: pulse 2.6s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .mouse { animation: wander 5.5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes wander {
        0%, 100% { transform: translate(0, 0); }
        30% { transform: translate(26px, -14px); }
        60% { transform: translate(-8px, 12px); }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">Herdr: one server, many terminals</text>
  <text x="32" y="62" class="sub">A background server owns the panes. Clients attach, detach, and reattach.</text>

  <!-- Client -->
  <rect x="32" y="96" width="210" height="330" rx="12" fill="#101728" stroke="#22304a"/>
  <text x="48" y="122" class="label">your terminal (client)</text>
  <rect x="48" y="136" width="178" height="140" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="60" y="160" class="mono">$ herdr</text>
  <text x="60" y="182" class="tiny">attached · 2 workspaces</text>
  <text x="60" y="200" class="tiny">ctrl+b q · detach</text>
  <rect x="60" y="214" width="8" height="12" class="blink" fill="#34d399"/>
  <text x="48" y="300" class="small">Mouse-first: click panes,</text>
  <text x="48" y="316" class="small">drag borders, right-click.</text>
  <g transform="translate(120, 350)">
    <g class="mouse">
      <ellipse cx="0" cy="0" rx="12" ry="18" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <line x1="0" y1="-18" x2="0" y2="-6" stroke="#64748b" stroke-width="1.5"/>
    </g>
  </g>
  <text x="150" y="388" class="tiny">optional keys</text>

  <!-- Attach link -->
  <line x1="246" y1="262" x2="314" y2="262" stroke="#34d399" stroke-width="2.2" class="flow" marker-end="url(#arrow)"/>
  <text x="280" y="246" class="tiny" text-anchor="middle" fill="#34d399">attach</text>

  <!-- Server -->
  <rect x="318" y="86" width="462" height="404" rx="14" fill="#0f1626" stroke="#24405c" stroke-width="2"/>
  <text x="338" y="116" class="label" fill="#7dd3fc">herdr server (background)</text>
  <text x="338" y="134" class="tiny">keeps processes alive — no client required</text>

  <!-- Workspace 1 -->
  <rect x="338" y="148" width="422" height="150" rx="10" fill="#121a2c" stroke="#1f2b44"/>
  <text x="352" y="171" class="label" fill="#e2e8f0">workspace · portfolio-site</text>
  <rect x="352" y="182" width="196" height="100" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="364" y="204" class="mono">claude · editing</text>
  <rect x="364" y="214" width="64" height="18" rx="9" fill="#3b2a12" stroke="#a16207"/>
  <text x="396" y="227" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  <text x="364" y="252" class="tiny">src/pages/search.tsx</text>
  <line x1="364" y1="262" x2="480" y2="262" stroke="#1e2940" stroke-width="3" stroke-linecap="round"/>
  <line x1="364" y1="262" x2="442" y2="262" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" class="pulse"/>

  <rect x="560" y="182" width="186" height="100" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="572" y="204" class="mono">shell · npm run dev</text>
  <rect x="572" y="214" width="46" height="18" rx="9" fill="#0f2438" stroke="#1d4ed8"/>
  <text x="595" y="227" class="tiny" text-anchor="middle" fill="#60a5fa">shell</text>
  <text x="572" y="252" class="tiny" fill="#34d399">http://localhost:3000</text>

  <!-- Workspace 2 -->
  <rect x="338" y="312" width="422" height="150" rx="10" fill="#121a2c" stroke="#1f2b44"/>
  <text x="352" y="335" class="label" fill="#e2e8f0">workspace · api-service</text>
  <rect x="352" y="346" width="196" height="100" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="364" y="368" class="mono">codex · review</text>
  <rect x="364" y="378" width="60" height="18" rx="9" fill="#3a1414" stroke="#b91c1c"/>
  <text x="394" y="391" class="tiny" text-anchor="middle" fill="#f87171">blocked</text>
  <text x="364" y="416" class="tiny">approve migration? y/n</text>
  <text x="364" y="432" class="tiny" fill="#fca5a5">needs you</text>

  <rect x="560" y="346" width="186" height="100" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="572" y="368" class="mono">opencode · docs</text>
  <rect x="572" y="378" width="46" height="18" rx="9" fill="#0d2a20" stroke="#15803d"/>
  <text x="595" y="391" class="tiny" text-anchor="middle" fill="#34d399">done</text>
  <text x="572" y="416" class="tiny">2 files changed</text>
  <text x="572" y="432" class="tiny" fill="#86efac">review ready</text>

  <text x="338" y="478" class="tiny">agent state rolls up: pane → tab → workspace</text>

  <!-- Remote machine -->
  <rect x="812" y="150" width="156" height="250" rx="12" fill="#101728" stroke="#22304a" stroke-dasharray="5 5"/>
  <text x="828" y="176" class="label">SSH machine</text>
  <text x="828" y="192" class="tiny">its own server</text>
  <rect x="828" y="204" width="124" height="112" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
  <text x="840" y="228" class="mono">codex</text>
  <rect x="840" y="238" width="60" height="18" rx="9" fill="#3b2a12" stroke="#a16207"/>
  <text x="870" y="251" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  <text x="840" y="286" class="tiny">GPU box</text>
  <text x="840" y="302" class="tiny">build + train</text>
  <text x="828" y="344" class="tiny">herdr --remote host</text>
  <text x="828" y="364" class="tiny">or: ssh + herdr</text>
  <text x="828" y="384" class="tiny" fill="#94a3b8">own reconnect</text>

  <line x1="780" y1="262" x2="808" y2="262" stroke="#64748b" stroke-width="1.8" class="flow-slow"/>

  <text x="500" y="512" class="tiny" text-anchor="middle" fill="#94a3b8">Panes, agents, and servers survive client detach — that is the whole point.</text>
</svg>
