<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Herdr sidebar showing rolled-up agent states</title>
  <desc id="desc">An animated diagram of the Herdr sidebar: workspaces roll up the states of their agents (working, blocked, done). A cursor views a finished agent, which changes its badge from done to idle. A legend explains each state.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .mono { font-size: 12.5px; fill: #cbd5e1; }
      .small { font-size: 12.5px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .pulse { animation: pulse 1.7s ease-in-out infinite; }
      .pulse-fast { animation: pulse 1.1s ease-in-out infinite; }
      .done-chip { animation: doneChip 9s ease-in-out infinite; }
      .idle-chip { animation: idleChip 9s ease-in-out infinite; }
      .cursor { animation: cursorMove 9s ease-in-out infinite; }
      .ripple { animation: ripple 9s ease-out infinite; }
      .caption { animation: caption 9s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes pulse-fast { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes doneChip { 0%, 58% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes idleChip { 0%, 58% { opacity: 0; } 66%, 100% { opacity: 1; } }
      @keyframes cursorMove {
        0%, 30% { transform: translate(0, 0); opacity: 1; }
        52%, 74% { transform: translate(128px, 62px); opacity: 1; }
        84%, 100% { transform: translate(128px, 62px); opacity: .5; }
      }
      @keyframes ripple {
        0%, 50% { opacity: 0; transform: scale(.5); }
        56% { opacity: .9; transform: scale(1.6); }
        68%, 100% { opacity: 0; transform: scale(1.6); }
      }
      @keyframes caption {
        0%, 54% { opacity: 0; }
        62%, 100% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">One sidebar, every agent — rolled up</text>
  <text x="32" y="62" class="sub">Each pane reports a state; tabs and workspaces inherit the most urgent one. You always know who needs you.</text>

  <!-- Sidebar panel -->
  <rect x="32" y="86" width="436" height="340" rx="12" fill="#0f1626" stroke="#22304a"/>
  <text x="50" y="112" class="tiny">WORKSPACES</text>

  <!-- Row 1: portfolio-site -->
  <rect x="44" y="124" width="412" height="78" rx="8" fill="#12203a" stroke="#1f2b44"/>
  <text x="60" y="148" class="label">portfolio-site</text>
  <rect x="356" y="134" width="60" height="18" rx="9" fill="#3a1414" stroke="#b91c1c"/>
  <text x="386" y="147" class="tiny" text-anchor="middle" fill="#f87171">blocked</text>

  <rect x="60" y="159" width="54" height="19" rx="9.5" fill="#3b2a12" stroke="#a16207"/>
  <text x="87" y="173" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  <text x="121" y="173" class="tiny">claude</text>

  <rect x="176" y="159" width="54" height="19" rx="9.5" fill="#3a1414" stroke="#b91c1c" class="pulse-fast"/>
  <text x="203" y="173" class="tiny" text-anchor="middle" fill="#f87171">blocked</text>
  <text x="237" y="173" class="tiny">codex</text>

  <g class="done-chip">
    <rect x="288" y="159" width="44" height="19" rx="9.5" fill="#1a2333" stroke="#334155"/>
    <text x="310" y="173" class="tiny" text-anchor="middle" fill="#94a3b8">done</text>
  </g>
  <g class="idle-chip">
    <rect x="288" y="159" width="44" height="19" rx="9.5" fill="#1a2333" stroke="#334155"/>
    <text x="310" y="173" class="tiny" text-anchor="middle" fill="#94a3b8">idle</text>
  </g>
  <text x="339" y="173" class="tiny">opencode</text>

  <!-- Row 2: api-service -->
  <rect x="44" y="212" width="412" height="70" rx="8" fill="#121a2c" stroke="#1f2b44"/>
  <text x="60" y="236" class="label">api-service</text>
  <rect x="356" y="222" width="60" height="18" rx="9" fill="#3b2a12" stroke="#a16207"/>
  <text x="386" y="235" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  <rect x="60" y="247" width="54" height="19" rx="9.5" fill="#3b2a12" stroke="#a16207" class="pulse"/>
  <text x="87" y="261" class="tiny" text-anchor="middle" fill="#fbbf24">working</text>
  <text x="121" y="261" class="tiny">opencode</text>
  <rect x="176" y="247" width="48" height="19" rx="9.5" fill="#0f2438" stroke="#1d4ed8"/>
  <text x="200" y="261" class="tiny" text-anchor="middle" fill="#60a5fa">shell</text>
  <text x="232" y="261" class="tiny">npm test --watch</text>

  <!-- Row 3: docs -->
  <rect x="44" y="292" width="412" height="70" rx="8" fill="#121a2c" stroke="#1f2b44"/>
  <text x="60" y="316" class="label">docs</text>
  <rect x="356" y="302" width="60" height="18" rx="9" fill="#0d2a20" stroke="#15803d"/>
  <text x="386" y="315" class="tiny" text-anchor="middle" fill="#34d399">done</text>
  <rect x="60" y="327" width="44" height="19" rx="9.5" fill="#0d2a20" stroke="#15803d"/>
  <text x="82" y="341" class="tiny" text-anchor="middle" fill="#34d399">done</text>
  <text x="111" y="341" class="tiny">hermes</text>
  <text x="60" y="352" class="tiny" fill="#64748b">viewed → becomes idle</text>

  <!-- Cursor -->
  <g transform="translate(214, 300)">
  <g class="cursor">
    <g class="ripple">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    </g>
    <path d="M0,0 L0,14 L4,10 L7,16 L10,15 L7,9 L12,8 Z" fill="#e2e8f0" stroke="#0b1020" stroke-width="1"/>
  </g>
  </g>

  <!-- Legend -->
  <g>
    <rect x="492" y="86" width="376" height="340" rx="12" fill="#0f1626" stroke="#22304a"/>
    <text x="510" y="112" class="tiny">STATE MEANING</text>

    <circle cx="516" cy="140" r="5" fill="#fbbf24"/>
    <text x="530" y="144" class="label" fill="#fbbf24">working</text>
    <text x="510" y="160" class="small">Agent is actively running a turn.</text>

    <circle cx="516" cy="190" r="5" fill="#f87171" class="pulse-fast"/>
    <text x="530" y="194" class="label" fill="#f87171">blocked</text>
    <text x="510" y="210" class="small">An approval or question UI needs you.</text>
    <text x="510" y="226" class="tiny">Inspect before typing — idle is not approval.</text>

    <circle cx="516" cy="256" r="5" fill="#34d399"/>
    <text x="530" y="260" class="label" fill="#34d399">done</text>
    <text x="510" y="276" class="small">Finished and not viewed yet.</text>

    <circle cx="516" cy="306" r="5" fill="#94a3b8"/>
    <text x="530" y="310" class="label" fill="#94a3b8">idle</text>
    <text x="510" y="326" class="small">Finished or waiting, already seen.</text>

    <circle cx="516" cy="356" r="5" fill="#64748b"/>
    <text x="530" y="360" class="label" fill="#64748b">unknown</text>
    <text x="510" y="376" class="small">Agent present, state not classifiable.</text>
    <text x="510" y="396" class="tiny">unknown is not a synonym for success.</text>
  </g>

  <text x="450" y="452" class="tiny caption" text-anchor="middle" fill="#93c5fd">Viewing a completion marks it seen: done → idle. Each client tracks that independently.</text>
</svg>
