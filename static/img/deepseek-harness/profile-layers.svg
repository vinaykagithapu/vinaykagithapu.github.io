<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">How a dsh profile is composed</title>
  <desc id="desc">An animated diagram of layered configuration: the dsh-base bundle, the web app bundle, the profile patch, the home patch, and command-line overlays stack in order, with later layers winning, and compose into one booted plugin tree on the right.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .small { font-size: 12.5px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .mono { font-size: 12px; fill: #cbd5e1; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
      .l1,.l2,.l3,.l4,.l5 { animation: rise 6s ease-in-out infinite; }
      .l1 { animation-delay: 0s; }
      .l2 { animation-delay: .7s; }
      .l3 { animation-delay: 1.4s; }
      .l4 { animation-delay: 2.1s; }
      .l5 { animation-delay: 2.8s; }
      .r1,.r2,.r3,.r4,.r5,.r6,.r7 { animation: appear 6s ease-in-out infinite; }
      .r1 { animation-delay: 1.2s; }
      .r2 { animation-delay: 1.7s; }
      .r3 { animation-delay: 2.2s; }
      .r4 { animation-delay: 2.7s; }
      .r5 { animation-delay: 3.2s; }
      .r6 { animation-delay: 3.7s; }
      .r7 { animation-delay: 4.2s; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes rise {
        0%, 100% { opacity: .5; }
        14% { opacity: 1; }
      }
      @keyframes appear {
        0% { opacity: 0; }
        18%, 92% { opacity: 1; }
        100% { opacity: 1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">Composing a profile</text>
  <text x="32" y="62" class="sub">Ordered layers build one plugin tree. Later layers win, row by row.</text>

  <!-- Layer stack -->
  <g class="l1">
    <rect x="48" y="386" width="424" height="54" rx="10" fill="#0f1a2e" stroke="#1d4ed8"/>
    <text x="66" y="409" class="label">dsh-base</text>
    <text x="66" y="427" class="tiny">bundle 1 · model access, tools, sandbox, persistence</text>
  </g>
  <g class="l2">
    <rect x="60" y="322" width="424" height="54" rx="10" fill="#0f1a2e" stroke="#1d4ed8"/>
    <text x="78" y="345" class="label">dsh-web-app</text>
    <text x="78" y="363" class="tiny">bundle 2 · browser UI, RPC, live streams</text>
  </g>
  <g class="l3">
    <rect x="72" y="258" width="424" height="54" rx="10" fill="#102033" stroke="#2dd4bf"/>
    <text x="90" y="281" class="label" fill="#5eead4">profiles/web/cordis.patch.yml</text>
    <text x="90" y="299" class="tiny">your overrides · replace a row or insert one</text>
  </g>
  <g class="l4">
    <rect x="84" y="194" width="424" height="54" rx="10" fill="#0f1a2e" stroke="#334155"/>
    <text x="102" y="217" class="label">home patch</text>
    <text x="102" y="235" class="tiny">shared across profiles in this DSH_HOME</text>
  </g>
  <g class="l5">
    <rect x="96" y="130" width="424" height="54" rx="10" fill="#0f1a2e" stroke="#7c3aed"/>
    <text x="114" y="153" class="label" fill="#c4b5fd">--patch extra.yml</text>
    <text x="114" y="171" class="tiny">command-line overlay · repeatable</text>
  </g>

  <text x="300" y="466" class="tiny" text-anchor="middle" fill="#64748b">each layer is a list of row patches; a targeted row's whole config is replaced</text>

  <!-- Flow -->
  <line x1="536" y1="286" x2="604" y2="286" stroke="#34d399" stroke-width="2.2" class="flow" marker-end="url(#arrow)"/>
  <text x="570" y="270" class="tiny" text-anchor="middle" fill="#34d399">compose</text>

  <!-- Runtime -->
  <rect x="610" y="104" width="352" height="368" rx="14" fill="#0c1526" stroke="#24405c" stroke-width="1.8"/>
  <text x="632" y="132" class="label" fill="#7dd3fc">booted plugin tree</text>
  <text x="632" y="150" class="tiny">one process · one runtime</text>

  <g class="r1">
    <rect x="632" y="166" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="188" class="mono">llm adapter</text>
    <text x="920" y="188" class="tiny" text-anchor="end">provider row</text>
  </g>
  <g class="r2">
    <rect x="632" y="208" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="230" class="mono">tools</text>
    <text x="920" y="230" class="tiny" text-anchor="end">scoped registry</text>
  </g>
  <g class="r3">
    <rect x="632" y="250" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="272" class="mono">system prompt</text>
    <text x="920" y="272" class="tiny" text-anchor="end">section assembly</text>
  </g>
  <g class="r4">
    <rect x="632" y="292" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="314" class="mono">agent loop</text>
    <text x="920" y="314" class="tiny" text-anchor="end">driver</text>
  </g>
  <g class="r5">
    <rect x="632" y="334" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="356" class="mono">session log</text>
    <text x="920" y="356" class="tiny" text-anchor="end">append-only</text>
  </g>
  <g class="r6">
    <rect x="632" y="376" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="398" class="mono">sandbox + approvals</text>
    <text x="920" y="398" class="tiny" text-anchor="end">permission presets</text>
  </g>
  <g class="r7">
    <rect x="632" y="418" width="308" height="34" rx="8" fill="#0a0f1c" stroke="#1e2940"/>
    <text x="646" y="440" class="mono">web app / headless / acp</text>
    <text x="920" y="440" class="tiny" text-anchor="end">surface</text>
  </g>
</svg>
