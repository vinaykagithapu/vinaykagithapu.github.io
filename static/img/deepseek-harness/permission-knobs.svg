<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Two knobs, named permission presets</title>
  <desc id="desc">An animated diagram: a sandbox-mode knob and an approval-policy knob on the left combine into named permission presets on the right — workspace-write with ask, danger-full-access with never, and an auto option. The knobs sweep through their settings while each preset card highlights in turn.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .small { font-size: 12px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .mono { font-size: 12px; fill: #cbd5e1; }
      .spin1 { animation: turn1 7s ease-in-out infinite; transform-origin: 0px 0px; }
      .spin2 { animation: turn2 7s ease-in-out infinite; transform-origin: 0px 0px; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.3s linear infinite; }
      .p1,.p2,.p3 { animation: hl 6.3s ease-in-out infinite; }
      .p1 { animation-delay: .8s; }
      .p2 { animation-delay: 2.6s; }
      .p3 { animation-delay: 4.4s; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes turn1 {
        0%, 100% { transform: rotate(-52deg); }
        45% { transform: rotate(18deg); }
        70% { transform: rotate(52deg); }
      }
      @keyframes turn2 {
        0%, 100% { transform: rotate(48deg); }
        40% { transform: rotate(-16deg); }
        75% { transform: rotate(-48deg); }
      }
      @keyframes hl {
        0%, 100% { opacity: .3; }
        14% { opacity: 1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">Two knobs, one selector</text>
  <text x="32" y="62" class="sub">Sandbox mode and approval policy stay independent. A preset bundles them under a name a session can switch to.</text>

  <!-- Knob 1 -->
  <g transform="translate(160,170)">
    <circle r="72" fill="#0c1526" stroke="#24405c" stroke-width="2"/>
    <circle r="52" fill="#0a0f1c" stroke="#1e2940"/>
    <g class="spin1">
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="7" fill="#38bdf8"/>
    <text x="0" y="30" class="tiny" text-anchor="middle" fill="#64748b">mode</text>
  </g>
  <text x="160" y="262" class="label" text-anchor="middle" fill="#bae6fd">sandbox mode</text>
  <text x="160" y="282" class="tiny" text-anchor="middle">read-only · workspace-write · full</text>

  <!-- Knob 2 -->
  <g transform="translate(160,368)">
    <circle r="72" fill="#0c1526" stroke="#24405c" stroke-width="2"/>
    <circle r="52" fill="#0a0f1c" stroke="#1e2940"/>
    <g class="spin2">
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="7" fill="#fbbf24"/>
    <text x="0" y="30" class="tiny" text-anchor="middle" fill="#64748b">policy</text>
  </g>
  <text x="160" y="452" class="label" text-anchor="middle" fill="#fcd34d">approval policy</text>
  <text x="160" y="470" class="tiny" text-anchor="middle">ask · never</text>

  <!-- Combine -->
  <path d="M 246 170 C 330 170 330 270 386 270" fill="none" stroke="#34d399" stroke-width="2" class="flow"/>
  <path d="M 246 368 C 330 368 330 300 386 300" fill="none" stroke="#34d399" stroke-width="2" class="flow"/>
  <rect x="392" y="250" width="96" height="70" rx="10" fill="#0f1a2e" stroke="#1e3350"/>
  <text x="440" y="276" class="tiny" text-anchor="middle" fill="#5eead4">bundle</text>
  <text x="440" y="294" class="tiny" text-anchor="middle" fill="#5eead4">as a</text>
  <text x="440" y="312" class="tiny" text-anchor="middle" fill="#5eead4">preset</text>
  <line x1="492" y1="285" x2="516" y2="285" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>

  <!-- Presets -->
  <g class="p1">
    <rect x="524" y="104" width="440" height="96" rx="12" fill="#101728" stroke="#38bdf8" stroke-width="2"/>
    <text x="544" y="132" class="label" fill="#bae6fd">workspace-write</text>
    <text x="944" y="132" class="tiny" text-anchor="end" fill="#94a3b8">default</text>
    <text x="544" y="156" class="mono">sandbox: workspace-write · approval: ask</text>
    <text x="544" y="178" class="small">the safe starting point: writes stay inside the workspace</text>
  </g>
  <g class="p2">
    <rect x="524" y="216" width="440" height="96" rx="12" fill="#101728" stroke="#f87171" stroke-width="2"/>
    <text x="544" y="244" class="label" fill="#fca5a5">danger-full-access</text>
    <text x="944" y="244" class="tiny" text-anchor="end" fill="#94a3b8">no boundary</text>
    <text x="544" y="268" class="mono">sandbox: danger-full-access · approval: never</text>
    <text x="544" y="290" class="small">only inside a disposable container or VM</text>
  </g>
  <g class="p3">
    <rect x="524" y="328" width="440" height="96" rx="12" fill="#101728" stroke="#a78bfa" stroke-width="2"/>
    <text x="544" y="356" class="label" fill="#c4b5fd">auto</text>
    <text x="944" y="356" class="tiny" text-anchor="end" fill="#94a3b8">when enabled</text>
    <text x="544" y="380" class="mono">danger-full-access · ask</text>
    <text x="544" y="402" class="small">published per session by the Auto-review integration</text>
  </g>

  <text x="524" y="452" class="tiny" fill="#64748b">a session derives “custom” when its knobs match no named preset</text>
  <text x="524" y="474" class="tiny" fill="#f87171">approvals ask; they do not confine — the sandbox is the boundary.</text>
</svg>
