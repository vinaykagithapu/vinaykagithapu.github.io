<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">The dsh turn and step loop</title>
  <desc id="desc">An animated diagram of the agent loop: a turn starts, then each step assembles the prompt, sends a model request, and runs tool calls. Tool results either feed another step or close the turn, so one turn can contain several steps.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5e7eb; }
      .title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .label { font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .small { font-size: 12px; fill: #94a3b8; }
      .tiny { font-size: 11.5px; fill: #64748b; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
      .flow-slow { stroke-dasharray: 5 7; animation: dash 2s linear infinite; }
      .s1,.s2,.s3,.s4 { animation: pulseBox 5.2s ease-in-out infinite; }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: .8s; }
      .s3 { animation-delay: 1.6s; }
      .s4 { animation-delay: 2.4s; }
      .tail { animation: pulseBox 5.2s ease-in-out infinite; animation-delay: 3.6s; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes pulseBox {
        0%, 100% { opacity: .55; }
        16% { opacity: 1; }
      }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="16" fill="#0b1020" stroke="#1e293b"/>
  <text x="32" y="40" class="title">One turn, many steps</text>
  <text x="32" y="62" class="sub">A turn opens with input. Each step is one model request plus its tools.</text>

  <!-- Step badge -->
  <rect x="40" y="92" width="150" height="26" rx="13" fill="#3b2a12" stroke="#a16207"/>
  <text x="115" y="110" class="tiny" text-anchor="middle" fill="#fbbf24">step 1 … step n</text>

  <!-- Box 1 -->
  <g class="s1">
    <rect x="40" y="140" width="186" height="100" rx="10" fill="#101728" stroke="#334155"/>
    <text x="58" y="166" class="label">turn/start</text>
    <text x="58" y="188" class="small">claim input</text>
    <text x="58" y="208" class="small">log the turn</text>
    <text x="58" y="226" class="tiny">durable event</text>
  </g>

  <!-- Box 2 -->
  <g class="s2">
    <rect x="258" y="140" width="212" height="100" rx="10" fill="#101728" stroke="#38bdf8"/>
    <text x="276" y="166" class="label" fill="#bae6fd">assemble</text>
    <text x="276" y="188" class="small">prompt sections</text>
    <text x="276" y="208" class="small">admitted tool schemas</text>
    <text x="276" y="226" class="tiny">step/start</text>
  </g>

  <!-- Box 3 -->
  <g class="s3">
    <rect x="502" y="140" width="212" height="100" rx="10" fill="#101728" stroke="#7c3aed"/>
    <text x="520" y="166" class="label" fill="#c4b5fd">model request</text>
    <text x="520" y="188" class="small">stream tokens</text>
    <text x="520" y="208" class="small">reasoning blocks</text>
    <text x="520" y="226" class="tiny">assistant/message</text>
  </g>

  <!-- Box 4 -->
  <g class="s4">
    <rect x="746" y="140" width="214" height="100" rx="10" fill="#101728" stroke="#2dd4bf"/>
    <text x="764" y="166" class="label" fill="#5eead4">tool calls</text>
    <text x="764" y="188" class="small">guarded pipeline</text>
    <text x="764" y="208" class="small">approvals · sandbox</text>
    <text x="764" y="226" class="tiny">tool/result</text>
  </g>

  <!-- Arrows -->
  <line x1="229" y1="190" x2="252" y2="190" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <line x1="473" y1="190" x2="496" y2="190" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <line x1="717" y1="190" x2="740" y2="190" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>

  <!-- Results -->
  <g class="s4">
    <rect x="746" y="292" width="214" height="82" rx="10" fill="#0f1a2e" stroke="#2dd4bf"/>
    <text x="764" y="318" class="label" fill="#5eead4">tool results</text>
    <text x="764" y="340" class="small">stdout, diffs, files</text>
    <text x="764" y="358" class="tiny">entered into the log</text>
  </g>
  <line x1="853" y1="243" x2="853" y2="286" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>

  <!-- Loop back -->
  <path d="M 744 333 L 364 333 L 364 246" fill="none" stroke="#fbbf24" stroke-width="2.2" class="flow-slow" marker-end="url(#arrow2)"/>
  <text x="556" y="322" class="tiny" text-anchor="middle" fill="#fbbf24">tools owe another request → next step</text>

  <!-- Exit -->
  <path d="M 900 380 L 900 438 L 856 438" fill="none" stroke="#34d399" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <g class="tail">
    <rect x="640" y="408" width="212" height="58" rx="10" fill="#101728" stroke="#334155"/>
    <text x="658" y="432" class="label">turn/end</text>
    <text x="658" y="452" class="tiny">nothing owed · turn closes</text>
  </g>

  <!-- Rejected-step note -->
  <text x="40" y="480" class="tiny">A step can be rejected before it starts: a pre-step policy may reject or rewrite the claimed input, and an</text>
  <text x="40" y="498" class="tiny">empty first batch closes the turn without spending a step. Turns and steps are counted separately.</text>
</svg>
